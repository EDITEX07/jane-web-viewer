
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>J.A.N.E.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #30000c, #050505 70%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 24px; }
    img {
      width: 145px;
      height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px #b00030);
    }
    h1 {
      color: #e20b32;
      letter-spacing: 6px;
      font-size: 32px;
      margin-bottom: 8px;
    }
    p {
      color: #c4aab0;
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 1px;
    }
    .loader {
      width: 150px;
      height: 3px;
      margin: 35px auto 24px;
      background: #44101d;
      overflow: hidden;
    }
    .loader::after {
      content: "";
      display: block;
      height: 100%;
      width: 45%;
      background: #e20b32;
      animation: move 1.3s infinite ease-in-out;
    }
    button {
      border: 0;
      border-radius: 9px;
      background: #c8002c;
      color: white;
      padding: 14px 25px;
      font-size: 15px;
      font-weight: bold;
    }
    @keyframes move {
      from { transform: translateX(-110%); }
      to { transform: translateX(330%); }
    }
  </style>
</head>
<body>
  <main>
    <img src="jane-logo.png" alt="J.A.N.E. logo"
         onerror="this.style.display='none'">
    <h1>J.A.N.E.</h1>
    <p>JUDICIAL ANALYTICAL AND<br>
       NEURORESEARCH ENGINE</p>
    <div class="loader"></div>
    <p>YOUR INTELLIGENCE WORKSPACE</p>
    <button onclick="window.location.href='https://jane-ai-editex07.streamlit.app/'">
      CONTINUE TO J.A.N.E.
    </button>
  </main>
</body>
</html>
